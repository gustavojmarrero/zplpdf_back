name: CI

# Hasta ahora build, lint y pruebas dependían de que alguien los corriera a mano
# antes de aprobar un PR, y no quedaba constancia de si se habían corrido (#79).
#
# El disparador es `push` SIN filtro de ramas, y no `pull_request`, por una razón
# empírica: en este repositorio los eventos `pull_request` no generan ninguna
# ejecución. Comprobado en los PR #85 y #86 —cero runs, y ninguno esperando
# aprobación—, mientras que el `push` a `development` sí corrió. La causa está en
# el lado de GitHub y no se ha podido determinar desde el repositorio, donde todo
# está en orden: Actions habilitado, YAML válido y el archivo en su sitio.
#
# No es un apaño: los check-runs se asocian al SHA del commit, no al PR, así que
# un run disparado por `push` sobre la rama de un PR aparece igual como check en
# ese PR. Se conserva `pull_request` por si vuelve a funcionar; tenerlo no cuesta
# nada y `concurrency` evita que, si algún día dispara, se dupliquen ejecuciones
# sobre el mismo ref.
on:
  pull_request:
    branches: [development, main]
  push:

# Un PR que recibe varios push seguidos no necesita terminar las ejecuciones
# viejas: solo importa el estado del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · lint · tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La misma que corre en producción (`FROM node:22-slim` en el
          # Dockerfile). Verificar sobre otra versión dejaría pasar justo lo que
          # solo falla en la desplegada.
          node-version: '22'
          cache: npm

      # `ci` y no `install`: instala exactamente lo del lockfile y falla si se
      # ha desincronizado de package.json, en vez de resolverlo por su cuenta.
      - run: npm ci

      # Sin `--fix`, a diferencia de `npm run lint`: aquí hay que detectar, no
      # arreglar. Con auto-fix el job pasaría en verde dejando los arreglos en un
      # runner que se destruye a continuación.
      - run: npm run lint:ci

      # `nest build` corre TSC además de compilar, así que esto también cubre el
      # chequeo de tipos del código de producción. Los specs quedan fuera: `tsc
      # --noEmit` todavía falla por imports sin extensión `.js` (#79), y añadirlo
      # como gate antes de sanearlos dejaría el CI en rojo desde el primer día.
      - run: npm run build

      - run: npm test
